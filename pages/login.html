<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Solace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/auth.css">
</head>
<body class="auth-body">
  <main class="page">
    <section class="glass-card">
      <img class="logo" src="../static/img/auth-logo.png" alt="Solace">
      <h1 class="card-title">Welcome back</h1>
<p class="card-subtitle">Sign in to continue your journey.</p>

<form class="form-panel" id="login-form" novalidate>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
    <small class="error" aria-live="polite"></small>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="input-wrap">
      <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
      <button type="button" class="toggle-pw" aria-label="Show password">Show</button>
    </div>
    <small class="error" aria-live="polite"></small>
  </div>

  <button type="submit" class="btn-primary">Sign In</button>

  <a href="#" class="link">Forgot password?</a>

  <p class="switch">New to Solace? <a href="register.html" class="link strong">Create an account</a></p>
</form>
    </section>
  </main>
  <script src="../static/js/auth.js"></script>
</body>
</html>
