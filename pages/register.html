<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Solace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/auth.css">
</head>
<body class="auth-body">
  <main class="page">
    <section class="glass-card">
      <img class="logo" src="../static/img/auth-logo.png" alt="Solace">
      <h1 class="card-title">Create Your Account</h1>

<div class="tabs" role="tablist">
  <button type="button" class="tab active" role="tab" data-role="client" aria-selected="true">Client</button>
  <button type="button" class="tab" role="tab" data-role="therapist" aria-selected="false">Therapist</button>
</div>

<form class="form-panel" id="register-form" novalidate>
  <input type="hidden" name="role" id="role" value="client">

  <div class="field">
    <label for="fullname">Full Name*</label>
    <input type="text" id="fullname" name="fullname" placeholder="Your full name" autocomplete="name" required>
    <small class="error" aria-live="polite"></small>
  </div>

  <div class="field">
    <label for="email">Email*</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
    <small class="error" aria-live="polite"></small>
  </div>

  <div class="field">
    <label for="password">Password*</label>
    <div class="input-wrap">
      <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
      <button type="button" class="toggle-pw" aria-label="Show password">Show</button>
    </div>
    <small class="error" aria-live="polite"></small>
  </div>

  <div class="field">
    <label for="confirm">Confirm Password*</label>
    <input type="password" id="confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password" required>
    <small class="error" aria-live="polite"></small>
  </div>

  <!-- Therapist-only fields -->
  <div class="therapist-only" hidden>
    <div class="field">
      <label for="license">License Number*</label>
      <input type="text" id="license" name="license" placeholder="Your professional license number">
      <small class="error" aria-live="polite"></small>
    </div>

    <div class="field">
      <input type="file" id="credentials" name="credentials" accept=".pdf,.jpg,.jpeg,.png" hidden>
      <label for="credentials" class="upload-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        <span id="credentials-name">Verify your credentials</span>
      </label>
      <small class="error" aria-live="polite"></small>
    </div>
  </div>

  <div class="field checkbox">
    <input type="checkbox" id="terms" name="terms" required>
    <label for="terms">I agree to the <a href="#" class="link">Terms</a> and <a href="#" class="link">Privacy Policy</a></label>
    <small class="error" aria-live="polite"></small>
  </div>

  <button type="submit" class="btn-primary">Create Account</button>

  <p class="switch">Already have an account? <a href="login.html" class="link strong">Sign In</a></p>
</form>
    </section>
  </main>
  <script src="../static/js/auth.js"></script>
</body>
</html>
